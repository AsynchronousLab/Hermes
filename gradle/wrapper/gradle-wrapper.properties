# Gradle wrapper for hermes-app.
#
# The distribution is fetched from a China mirror: `services.gradle.org`
# answered a HEAD request in ~7.4 s here and then stalled the 100 MB download
# at 0 bytes. `mirrors.cloud.tencent.com` served the same file in ~0.5 s.
# `mirrors.aliyun.com/gradle/` does NOT carry Gradle distributions (404) —
# Aliyun only mirrors Maven artifacts, which this build already uses for
# dependencies.
#
# To use the canonical URL instead, replace the line below with:
#   https\://services.gradle.org/distributions/gradle-8.13-bin.zip

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists