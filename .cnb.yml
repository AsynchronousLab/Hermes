# GitHub builds and tests the APK. CNB publishes the identical verified asset.
#
# v0.1.8 的镜像任务失败过一次：api.github.com 对未认证请求按 IP 限流（60 次/小时），
# CNB 构建节点是共享 IP，第一个 `git/ref/tags` 就返回 403，发布直接失败（0.1.5 也丢过）。
# 下面改用 git 协议校验 tag、用发布附件直链下载，GitHub API 只做「查得到就比对」的旁路校验。
# 发版时记得把 git:release 的 title 改成新版本号。
"v*":
  tag_push:
    - name: Publish Android APK
      docker:
        image: python:3.12-slim
      stages:
        - name: Download the APK built from this tag
          script: |
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
            python3 - <<'PY'
            import hashlib
            import json
            import os
            import subprocess
            import time
            import urllib.error
            import urllib.request

            tag = os.environ['CNB_BRANCH']
            commit = os.environ['CNB_COMMIT']
            repo = 'https://github.com/AsynchronousLab/Hermes'
            api = 'https://api.github.com/repos/AsynchronousLab/Hermes'

            # tag → commit 走 git 协议：不需要 token，也不受 API 的按 IP 限流影响。
            out = subprocess.run(
                ['git', 'ls-remote', f'{repo}.git', f'refs/tags/{tag}', f'refs/tags/{tag}^{{}}'],
                capture_output=True, text=True, check=True).stdout
            peeled = [line.split()[0] for line in out.splitlines() if line.endswith('^{}')]
            direct = [line.split()[0] for line in out.splitlines() if not line.endswith('^{}')]
            resolved = (peeled or direct or [''])[0]
            if resolved != commit:
                raise SystemExit(f'tag {tag} points at {resolved}, CNB has {commit}')
            print(f'Release source verified: {tag} = {resolved}', flush=True)

            # 直链下载：releases/download 走 CDN，不计入 API 限流。
            url = f'{repo}/releases/download/{tag}/Hermes.apk'
            for attempt in range(60):
                request = urllib.request.Request(
                    url, method='HEAD', headers={'User-Agent': 'Hermes-CNB-release'})
                try:
                    with urllib.request.urlopen(request, timeout=30):
                        break
                except urllib.error.HTTPError as error:
                    # 5xx（含 GitHub CDN 偶发的 504）和 404（附件还没传完）都重试。
                    if error.code != 404 and error.code < 500:
                        raise
                except urllib.error.URLError:
                    pass
                if attempt == 59:
                    raise SystemExit('GitHub APK did not appear in time')
                print('Waiting for the GitHub APK...', flush=True)
                time.sleep(10)

            digest = hashlib.sha256()
            size = 0
            for attempt in range(3):
                digest = hashlib.sha256()
                size = 0
                try:
                    request = urllib.request.Request(url, headers={'User-Agent': 'Hermes-CNB-release'})
                    with urllib.request.urlopen(request, timeout=300) as response, open('Hermes.apk', 'wb') as output:
                        while chunk := response.read(1024 * 1024):
                            output.write(chunk)
                            digest.update(chunk)
                            size += len(chunk)
                    break
                except urllib.error.HTTPError as error:
                    if error.code < 500 or attempt == 2:
                        raise
                    print(f'download failed with HTTP {error.code}, retrying...', flush=True)
                    time.sleep(5)
            sha = digest.hexdigest().upper()
            print(f'Downloaded {size} bytes, SHA256 {sha}', flush=True)

            # 旁路校验：API 可用时对一遍 GitHub 的发布说明；限流就跳过，不拖垮发布。
            try:
                with urllib.request.urlopen(urllib.request.Request(
                        f'{api}/releases/tags/{tag}',
                        headers={'User-Agent': 'Hermes-CNB-release'}), timeout=30) as response:
                    body = json.load(response).get('body') or ''
                if sha not in body.upper() or commit not in body:
                    raise SystemExit('release notes do not match the downloaded APK')
                print('release notes match the APK', flush=True)
            except urllib.error.HTTPError as error:
                print(f'warning: skipped the release-notes cross-check (HTTP {error.code})', flush=True)

            # CNB 的发布说明 = 仓库里的更新列表 + 本次产物的校验值。
            notes = open('RELEASE_NOTES.md', encoding='utf-8').read()
            marker = '## 这个版本包含'
            _, separator, changes = notes.partition(marker)
            if not separator or not changes.strip():
                raise SystemExit('RELEASE_NOTES.md must contain a nonempty changelog')
            with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as output:
                output.write('# Hermes Android ' + tag.removeprefix('v') + '\n\n')
                output.write('Hermes 后端的 Android 客户端 debug 构建，附件 `Hermes.apk` 直接下载安装。\n\n')
                output.write('## 校验\n\n```\n')
                output.write(f'文件大小  {size} 字节\n')
                output.write(f'SHA256    {sha}\n')
                output.write('```\n\n')
                output.write(f'对应 commit `{commit}`，与 GitHub Release 的附件是同一份。\n\n')
                output.write(marker + '\n\n' + changes.strip() + '\n')
            print('release notes written', flush=True)
            PY
        - name: Create the CNB Release
          type: git:release
          options:
            title: Hermes Android 0.1.8-debug
            preRelease: false
            latest: true
            descriptionFromFile: RELEASE_NOTES.md
        - name: Attach Hermes.apk to the release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Hermes.apk
