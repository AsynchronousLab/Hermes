# GitHub builds and tests the APK. CNB publishes the identical verified asset.
"v*":
  tag_push:
    - name: Publish Android APK
      docker:
        image: python:3.12-slim
      stages:
        - name: Download the APK built from this tag
          script: |
            python3 - <<'PY'
            import hashlib
            import json
            import os
            import time
            import urllib.error
            import urllib.request

            tag = os.environ['CNB_BRANCH']
            commit = os.environ['CNB_COMMIT']
            api = 'https://api.github.com/repos/AsynchronousLab/Hermes'

            def read_json(url):
                req = urllib.request.Request(url, headers={'User-Agent': 'Hermes-CNB-release'})
                with urllib.request.urlopen(req, timeout=30) as response:
                    return json.load(response)

            ref = read_json(f'{api}/git/ref/tags/{tag}')['object']
            while ref['type'] == 'tag':
                ref = read_json(f"{api}/git/tags/{ref['sha']}")['object']
            if ref['type'] != 'commit' or ref['sha'] != commit:
                raise SystemExit('GitHub and CNB release source commits do not match')

            for attempt in range(60):
                try:
                    release = read_json(f'{api}/releases/tags/{tag}')
                    asset = next(a for a in release['assets'] if a['name'] == 'Hermes.apk')
                    break
                except (urllib.error.URLError, StopIteration):
                    if attempt == 59:
                        raise
                    print('Waiting for the GitHub APK...', flush=True)
                    time.sleep(10)

            request = urllib.request.Request(asset['browser_download_url'], headers={'User-Agent': 'Hermes-CNB-release'})
            digest = hashlib.sha256()
            size = 0
            with urllib.request.urlopen(request, timeout=120) as response, open('Hermes.apk', 'wb') as output:
                while chunk := response.read(1024 * 1024):
                    output.write(chunk)
                    digest.update(chunk)
                    size += len(chunk)
            if size != asset['size']:
                raise SystemExit('APK size verification failed')
            if asset.get('digest') != 'sha256:' + digest.hexdigest():
                raise SystemExit('APK SHA256 verification failed')
            if commit not in release['body'] or digest.hexdigest().upper() not in release['body']:
                raise SystemExit('Release notes do not match the APK and source commit')
            with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as notes:
                notes.write(release['body'])
            print(f'Verified {tag} ({commit}): {size} bytes, SHA256 {digest.hexdigest()}', flush=True)
            PY
        - name: Create the CNB Release
          type: git:release
          options:
            title: Hermes Android 0.1.0-debug
            preRelease: false
            latest: true
            descriptionFromFile: RELEASE_NOTES.md
        - name: Attach Hermes.apk to the release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Hermes.apk
